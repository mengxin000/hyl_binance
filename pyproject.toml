[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hyperl-binance-spread"
version = "0.2.0"
description = "Public-market Hyperliquid and Binance spread screener"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "numpy>=1.24,<3",
    "requests>=2.31,<3",
    "websockets>=15,<16",
]

[project.scripts]
hyperl-binance = "hyperl_binance.cli:main"
hyperl-binance-guardian = "hyperl_binance.guardian:main"
hpl-binance = "hyperl_binance.guardian:main"

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/hyperl_binance"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "config", "tools", "README.md", "pyproject.toml", "uv.lock", "main.py", "guardian.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E9", "F", "I"]
